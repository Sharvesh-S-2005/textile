# Single source of truth for zones, workers, machines, limits and thresholds.
# No module may hard-code any value that lives here.

mqtt:
  host: localhost
  port: 1883
  keepalive_s: 60
  qos: 1
  topic_prefix: textile
  # Field devices (and the simulator) use their device_id as client ID, per the
  # data contract. This prefix is for backend clients such as the ingest subscriber.
  client_id_prefix: ohs-backend

simulation:
  schema_version: "1.1"
  env_interval_s: 10
  ble_interval_s: 30
  machine_interval_s: 10
  speed_factor: 1.0
  random_seed: 42
  firmware_tag: "sim-0.1.0"
  # Day 8A: caps on everything the publisher keeps while running, so a long run's
  # memory cannot grow with its length. None of these changes a random draw.
  memory_bounds:
    ground_truth_flush_lines: 1000     # flush the ground-truth JSONL every N lines
    outage_buffer_max_records: 50000   # per device "microSD" buffer; oldest overwritten (logged)
    stop_log_max_per_machine: 5000     # StopRecord history (verify_stochastics needs about 1,400 in 28 days)
    # tests/test_memory_bounds.py: dry-run this window in-process; private memory at the
    # end must be within margin_mb of the value 10% of the way through.
    regression_window_h: 24
    regression_margin_mb: 20

  # Parameters for simulator/profiles.py (zone hazard model).
  zone_dynamics:
    # Level a zone falls to with all machines stopped (ventilation, people, traffic).
    background_noise_dba: {mean: 60.0, sd: 2.0}
    # PM decays toward this fraction of the zone mean with all machines stopped.
    pm_floor_fraction: 0.12
    pm10_ratio_log_sd: 0.08
    outdoor_co2_ppm: 420
    # Ornstein-Uhlenbeck relaxation time constants (seconds) per quantity.
    tau_s: {noise: 30, pm: 600, temp: 1800, rh: 1800, co2: 3600, globe: 300}
    diurnal:
      temp_amplitude_c: 2.0
      temp_peak_hour_local: 15     # hottest mid-afternoon; RH peaks 12 h later
      rh_amplitude_pct: 6.0
      machine_heat_c: 1.0          # extra air temp with all machines running
      globe_idle_fraction: 0.3     # share of globe_offset_c present with machines off
      # The diurnal curve carries part of the profile sd; the random walk carries this share.
      residual_sd_fraction: 0.5
      globe_sd_c: 0.3
    noise_crest_db: {min: 3.0, mean_extra: 3.0}   # noise_peak - noise_dba
    transients:
      noise_rate_per_h: 6          # loom starts, shuttle knocks, blowdowns
      noise_boost_db: {min: 4.0, max: 10.0}
      noise_peak_boost_db: {min: 8.0, max: 18.0}
      noise_duration_readings: {min: 1, max: 3}
      dust_rate_per_h: 0.4         # cleaning / blowdown cycles
      dust_impulse_x_mean: {min: 0.5, max: 1.5}
    sensor_faults:
      rate_per_sensor_per_h: 0.02
      duration_min: {min: 2, max: 10}
      kinds: [stale, error]
    pm_drift:
      gain_per_day: 0.015          # optical PM sensor reads high as lint builds up
      needs_clean_gain: 1.25
      clean_after_h: 8             # time for maintenance to clean once flagged
      initial_days_since_clean_max: 15
    # Failures the sensor does not notice (flag stays "ok"); the backend's
    # stuck-value and spike checks exist to catch them. ~5 of each per 8 h run.
    silent_faults:
      stuck: {rate_per_sensor_per_h: 0.02, duration_min: {min: 6, max: 12}}
      glitch: {rate_per_sensor_per_h: 0.02, magnitude_x_spike_threshold: 1.5}

  # Parameters for simulator/machine_model.py.
  machine_dynamics:
    changeover_min: 10             # machines idle at each shift start during crew handover
    stagger_max_s: 90              # per-machine lag on every start/stop
    current_noise_fraction: 0.03
    inrush: {multiplier: {min: 2.5, max: 4.0}, duration_s: 10}   # first reading after start
    standby_current_a: {mean: 0.08, sd: 0.03}
    running_threshold_fraction: 0.2   # running = current_a > this * rated_current_a
    vib_noise_fraction: 0.06
    vib_crest_factor: {min: 2.2, max: 3.0}   # vib_peak_g / vib_rms_g
    idle_vib_rms_g: {mean: 0.01, sd: 0.004}
    degradation:
      ratio_at_30_days: 2.5        # vib_rms multiplier after 30 simulated days
      initial_days: 0              # wear already accumulated at simulation start
    # Same fault behaviour as the zone nodes, on the current and vibration channels.
    sensor_faults:
      rate_per_sensor_per_h: 0.02
      duration_min: {min: 2, max: 10}
      kinds: [stale, error]

  # Stochastic machine behaviour (Day 8; simulator/machine_stochastics.py). PRE-REGISTERED
  # in docs/preregistration_day8.md and committed before any evaluation was run. Values
  # come from mill characteristics, never from ML results. Each is marked:
  #   [literature]  - from published mill practice
  #   [assumption]  - a stated assumption of this project, NOT a citation
  # Off by default: the deterministic simulator stays the default and is kept intact;
  # the stochastic dataset is generated with `--machine-stochastics`.
  machine_stochastics:
    enabled: false
    # Machine type per zone. Z3 (drawing) and Z6 (winding) are not in the Day 8 brief's
    # table; they get stops too, so no zone stays clock-driven. [assumption]
    zone_machine_type: {Z1: blowroom, Z2: carding, Z3: drawing, Z4: ring_spinning, Z5: weaving, Z6: winding}
    # Unplanned stops: inter-arrival ~ Exponential(mean_run_min_between_stops), counted in
    # RUNNING time; duration ~ Lognormal(median_min, sigma). Unplanned-stop availability
    # = mean_gap / (mean_gap + median * exp(sigma^2 / 2)).
    # target_availability is the band the MEASURED total availability (running time /
    # baseline scheduled time, including late and skipped starts) must fall in.
    types:
      weaving:          # warp break, weft break, pick fault; weaver mends in a few minutes
        target_availability: [0.78, 0.92]    # [literature] modern loom efficiency 78-92%
        mean_run_min_between_stops: 25       # [assumption] split of the band into rate x duration
        stop_duration_median_min: 3.0        # [assumption]
        stop_duration_sigma: 0.8             # [assumption]
      ring_spinning:    # doffing stops the frame; end breaks are pieced up without stopping it
        target_availability: [0.85, 0.95]    # [assumption]
        mean_run_min_between_stops: 150      # [assumption] doff interval
        stop_duration_median_min: 10.0       # [assumption] doff time
        stop_duration_sigma: 0.4             # [assumption] doffing is fairly regular
      blowroom:         # lap change, choke, cleaning
        target_availability: [0.80, 0.93]    # [assumption]
        mean_run_min_between_stops: 90       # [assumption]
        stop_duration_median_min: 8.0        # [assumption]
        stop_duration_sigma: 0.9             # [assumption] chokes are occasionally long
      carding:          # flat cleaning, sliver breaks; ALSO starved by blowroom chokes (below)
        target_availability: [0.80, 0.93]    # [assumption]
        # Was 120: measured carding availability 0.797 / 0.794, just below the band, because
        # starvation losses were underestimated. Raised once, BEFORE any evaluation, to put
        # the measured value in its band (recorded in the pre-registration). [assumption]
        mean_run_min_between_stops: 180
        stop_duration_median_min: 8.0        # [assumption]
        stop_duration_sigma: 0.9             # [assumption]
      drawing:          # can change, sliver break
        target_availability: [0.85, 0.95]    # [assumption]
        mean_run_min_between_stops: 60       # [assumption]
        stop_duration_median_min: 4.0        # [assumption]
        stop_duration_sigma: 0.7             # [assumption]
      winding:          # package doff, yarn break, splicer fault
        target_availability: [0.85, 0.95]    # [assumption]
        mean_run_min_between_stops: 45       # [assumption]
        stop_duration_median_min: 3.0        # [assumption]
        stop_duration_sigma: 0.7             # [assumption]
    # Shift starts (every machine, every shift): an independent offset after the existing
    # changeover, and a chance of a late start or no start at all (order gap, planned
    # maintenance). [assumption]
    shift_start:
      offset_max_min: 8
      late_probability: 0.10
      late_extra_min: [15, 60]
      skip_probability: 0.02
    # Variable load: current = rated x load, load a reflected random walk (yarn count,
    # fabric changes). Changes CURRENT only, not zone noise: noise follows stops, which
    # is what the brief specifies; a load-noise coupling would be an invention. [assumption]
    load:
      bounds: [0.70, 1.00]
      step_sd_per_min: 0.01
    # Correlated stops: a blowroom stop longer than the chute buffer starves carding,
    # which stops `buffer_min` after the blowroom does and restarts `restart_lag_min`
    # after it restarts. [assumption]
    dependencies:
      - {upstream: M1, downstream: M2, buffer_min: 5, restart_lag_min: 2}

  # Parameters for simulator/worker_model.py.
  worker_dynamics:
    check_in_before_min: {min: 3, max: 15}
    check_out_after_min: {min: 2, max: 10}
    home_dwell_mean_min: 45        # exponential dwell in home zone before a short trip
    away_dwell_min: {min: 3, max: 12}
    break_zone: Z7                 # breaks, pre-shift and post-shift time
    overtime: {probability: 0.1, duration_min: {min: 30, max: 120}}
    # Deliberate high-exposure case for the dashboard: long overtime, rarely leaves
    # the home zone, skips tea breaks.
    high_exposure_workers: [W105]
    high_exposure:
      overtime_min: {min: 120, max: 180}
      home_dwell_mean_min: 240
      skips_tea_breaks: true
    ppe:
      partial_share_of_noncompliance: 0.5   # rest of the non-compliant share is not_worn
      unknown_probability: 0.02
      record_delay_min: {min: 5, max: 30}   # supervisor round after shift start
    supervisors: {A: SUP-01, B: SUP-02, C: SUP-03}
    # Pairs who arrive together and tap the gate within the same second, every
    # shift. This exercises event_id deduplication (same device, same ts, two
    # distinct events). The first worker of each pair must come first in `workers`.
    same_second_tap_pairs: [[W101, W102], [W109, W110], [W116, W117]]

  # BLE sightings produced by the publisher from the workers' true zones.
  # Tags are also heard by adjacent zone nodes (leakage); the backend must resolve it.
  ble_model:
    advert_interval_s: 1.0                 # tag advertises ~1 Hz
    same_zone: {detect_probability: 0.97, rssi_dbm: {mean: -65, sd: 7}, seen_fraction: {min: 0.4, max: 0.9}}
    adjacent_zone: {detect_probability: 0.5, rssi_dbm: {mean: -83, sd: 6}, seen_fraction: {min: 0.05, max: 0.3}}

  # Network outage demo: one zone node goes offline, buffers to microSD, then
  # replays with original timestamps. Overridable from the publisher command line.
  outage:
    enabled: true
    zone_id: Z3
    start_offset_min: 90           # simulated minutes after the run starts
    duration_min: 5

  # publisher --align-shifts (default on): start snaps back to the latest shift
  # boundary, end extends to the next one, then both are widened by these margins,
  # and only crews whose whole session fits are simulated. Shifts overlap at every
  # handover, so no cut point avoids truncating someone otherwise.
  align_shifts:
    margin_before_min: 20          # >= worker_dynamics.check_in_before_min.max (15)
    margin_after_min: 200          # >= high_exposure.overtime_min.max (180) + check_out_after_min.max (10)

# Physical devices that are not zone or machine nodes.
devices:
  gate: {device_id: GW-01, gate_id: GATE-A}
  ppe_app: {device_id: SUP-APP}

# Mill floor layout, process-flow order. Used for worker movement and BLE leakage.
layout:
  adjacency:
    Z1: [Z2]
    Z2: [Z1, Z3]
    Z3: [Z2, Z4]
    Z4: [Z3, Z5]
    Z5: [Z4, Z6]
    Z6: [Z5, Z7]
    Z7: [Z6]

# Profile values describe the zone with all its machines running.
# mean +/- 2*sd spans the range in the CLAUDE.md zone table (~95% of samples).
# PM10 is set to ~2x PM2.5 because cotton dust is dominated by coarse particles.
zones:
  - zone_id: Z1
    name: Blowroom
    device_id: ZN-Z1
    profile:
      noise_dba:   {mean: 91.5,  sd: 1.75}   # 88-95
      pm25_ugm3:   {mean: 275.0, sd: 62.5}   # 150-400
      pm10_ugm3:   {mean: 550.0, sd: 125.0}
      temp_c:      {mean: 33.0,  sd: 2.0}
      rh_pct:      {mean: 65.0,  sd: 5.0}
      co2_ppm:     {mean: 750.0, sd: 100.0}
      globe_offset_c: 2.5
  - zone_id: Z2
    name: Carding
    device_id: ZN-Z2
    profile:
      noise_dba:   {mean: 88.5,  sd: 1.75}   # 85-92
      pm25_ugm3:   {mean: 350.0, sd: 75.0}   # 200-500
      pm10_ugm3:   {mean: 700.0, sd: 150.0}
      temp_c:      {mean: 34.0,  sd: 2.0}
      rh_pct:      {mean: 62.0,  sd: 5.0}
      co2_ppm:     {mean: 800.0, sd: 100.0}
      globe_offset_c: 3.0
  - zone_id: Z3
    name: Drawing/Combing
    device_id: ZN-Z3
    profile:
      noise_dba:   {mean: 85.0,  sd: 1.5}    # 82-88
      pm25_ugm3:   {mean: 140.0, sd: 30.0}   # 80-200
      pm10_ugm3:   {mean: 280.0, sd: 60.0}
      temp_c:      {mean: 32.0,  sd: 2.0}
      rh_pct:      {mean: 63.0,  sd: 5.0}
      co2_ppm:     {mean: 800.0, sd: 100.0}
      globe_offset_c: 2.0
  - zone_id: Z4
    name: Ring Spinning
    device_id: ZN-Z4
    profile:
      noise_dba:   {mean: 95.5,  sd: 1.75}   # 92-99
      pm25_ugm3:   {mean: 105.0, sd: 22.5}   # 60-150
      pm10_ugm3:   {mean: 210.0, sd: 45.0}
      temp_c:      {mean: 33.5,  sd: 2.0}
      rh_pct:      {mean: 75.0,  sd: 4.0}    # high RH for yarn quality
      co2_ppm:     {mean: 900.0, sd: 120.0}
      globe_offset_c: 2.5
  - zone_id: Z5
    name: Weaving/Power Loom
    device_id: ZN-Z5
    profile:
      noise_dba:   {mean: 98.5,  sd: 1.75}   # 95-102
      pm25_ugm3:   {mean: 85.0,  sd: 17.5}   # 50-120
      pm10_ugm3:   {mean: 170.0, sd: 35.0}
      temp_c:      {mean: 33.0,  sd: 2.0}
      rh_pct:      {mean: 70.0,  sd: 5.0}
      co2_ppm:     {mean: 950.0, sd: 120.0}
      globe_offset_c: 3.0
  - zone_id: Z6
    name: Winding/Packing
    device_id: ZN-Z6
    profile:
      noise_dba:   {mean: 87.5,  sd: 1.25}   # 85-90
      pm25_ugm3:   {mean: 70.0,  sd: 15.0}   # 40-100
      pm10_ugm3:   {mean: 140.0, sd: 30.0}
      temp_c:      {mean: 31.0,  sd: 2.0}
      rh_pct:      {mean: 62.0,  sd: 5.0}
      co2_ppm:     {mean: 800.0, sd: 100.0}
      globe_offset_c: 1.5
  - zone_id: Z7
    name: Office/Store
    device_id: ZN-Z7
    profile:
      noise_dba:   {mean: 55.0,  sd: 2.5}    # 50-60
      pm25_ugm3:   {mean: 20.0,  sd: 5.0}    # 10-30
      pm10_ugm3:   {mean: 35.0,  sd: 8.0}
      temp_c:      {mean: 28.0,  sd: 1.5}
      rh_pct:      {mean: 55.0,  sd: 5.0}
      co2_ppm:     {mean: 700.0, sd: 100.0}
      globe_offset_c: 0.5

