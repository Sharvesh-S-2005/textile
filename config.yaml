# Local times in Asia/Kolkata. C shift crosses midnight.
shifts:
  timezone: Asia/Kolkata
  definitions:
    - shift_id: A
      start: "06:00"
      end: "14:00"
      breaks:
        - {kind: tea,   start: "08:00", duration_min: 10}
        - {kind: lunch, start: "10:00", duration_min: 30}
        - {kind: tea,   start: "12:00", duration_min: 10}
    - shift_id: B
      start: "14:00"
      end: "22:00"
      breaks:
        - {kind: tea,   start: "16:00", duration_min: 10}
        - {kind: lunch, start: "18:00", duration_min: 30}
        - {kind: tea,   start: "20:00", duration_min: 10}
    - shift_id: C
      start: "22:00"
      end: "06:00"
      breaks:
        - {kind: tea,   start: "00:00", duration_min: 10}
        - {kind: lunch, start: "02:00", duration_min: 30}
        - {kind: tea,   start: "04:00", duration_min: 10}

exposure_limits:
  criteria:
    niosh:
      criterion_db: 85
      exchange_rate_db: 3
      duration_h: 8
      threshold_db: 80             # levels below this contribute zero to the NIOSH dose
      source: "NIOSH 98-126, Criteria for a Recommended Standard: Occupational Noise Exposure"
    india:
      # Permitted exposure halves per 5 dB: 8 h at 90, 4 h at 95, 2 h at 100,
      # 1 h at 105, 30 min at 110, 15 min at 115 dBA.
      # NOTE: rules under the OSH Code 2020 may supersede this schedule; re-check
      # before final submission.
      criterion_db: 90
      exchange_rate_db: 5
      duration_h: 8
      threshold_db: 90             # levels below 90 dBA contribute zero to the India dose
      absolute_max_db: 115         # no exposure above this is permitted: hard alarm, not dose
      source: "Schedule XXVIII, Rule 95, Tamil Nadu Factories Rules"
  # ISO 7243:2017 WBGT reference value, metabolic rate class 2 (moderate work),
  # acclimatised worker. The assumption is stated wherever the value is shown.
  wbgt_limit_c: 28.0
  wbgt_work_category: moderate
  rh_correction_threshold_pct: 75

# Parameters of the exposure methods (exposure/). Assumptions, not measurements.
exposure_methods:
  pm_humidity_correction:
    # C_corr = C_raw / (1 + kappa * a_w / (1 - a_w)), a_w = RH/100 (Crilley et al. 2018).
    # Crilley et al. fitted kappa ~0.4 for ambient UK aerosol on an OPC-N2. Cotton dust
    # is fibrous cellulose, far less hygroscopic, so kappa is set low. A larger kappa
    # LOWERS the reported dust (the unsafe direction); 0.05 barely corrects and errs
    # toward over-reporting. An assumption of this project, not a measured value.
    kappa: 0.05
    # The form diverges as RH -> 100%. Above this RH, a_w is capped (project
    # assumption for numerical stability, not part of the cited method).
    rh_cap_pct: 95.0
    method: "kappa_koehler_crilley_2018"
    source: "Crilley et al. (2018), Atmospheric Measurement Techniques 11, 709-720"
  dust_label: indicative           # optical PM is never compared with regulatory limits
  wbgt:
    t_nw_method: stull_psychrometric_approximation
    source: "ISO 7243:2017 (WBGT); Stull (2011), J. Appl. Meteor. Climatol. 50, 2267-2269"

# Valid ranges match docs/data_contract.md sections 4-6.
# spike_threshold = max plausible change between consecutive readings.
validation:
  fields:
    noise_dba:       {min: 30.0,  max: 140.0,   spike_threshold: 25.0}
    noise_peak_dba:  {min: 30.0,  max: 150.0,   spike_threshold: 35.0}
    pm25_ugm3:       {min: 0.0,   max: 2000.0,  spike_threshold: 500.0}
    pm10_ugm3:       {min: 0.0,   max: 3000.0,  spike_threshold: 800.0}
    temp_c:          {min: -10.0, max: 70.0,    spike_threshold: 5.0}
    rh_pct:          {min: 0.0,   max: 100.0,   spike_threshold: 15.0}
    globe_temp_c:    {min: -10.0, max: 90.0,    spike_threshold: 8.0}
    co2_ppm:         {min: 300,   max: 10000,   spike_threshold: 1500}
    current_a:       {min: 0.0,   max: 200.0,   spike_threshold: 150.0}
    vib_rms_g:       {min: 0.0,   max: 16.0,    spike_threshold: 5.0}
    vib_peak_g:      {min: 0.0,   max: 16.0,    spike_threshold: 10.0}
    scan_window_s:   {min: 5,     max: 120,     spike_threshold: 120}
    rssi_dbm:        {min: -100,  max: -20,     spike_threshold: 80}
    seen_count:      {min: 1,     max: 1000,    spike_threshold: 1000}
    # Status counters (section 9): non-negative integers; max = unsigned 32-bit.
    # Not history fields, so spike_threshold is never applied (set to the max).
    uptime_s:         {min: 0,    max: 4294967295, spike_threshold: 4294967295}
    buffered_records: {min: 0,    max: 4294967295, spike_threshold: 4294967295}
  allowed_sensor_flags: [ok, stale, error, uncalibrated, needs_clean]
  allowed_ppe_values: [worn, partial, not_worn, unknown]
  allowed_rfid_events: [check_in, check_out]
  stuck_value_count: 30
  future_ts_tolerance_s: 600
  late_upload_threshold_s: 7200

# ingest/localisation.py - BLE sightings -> one zone per worker per window.
# Values are chosen from physical reasoning, not fitted to the simulator.
localisation:
  method: ble_ewma_hysteresis     # stored with every assignment row
  window_s: 30                    # one decision per BLE scan window (contract: 30 s scans)
  # RSSI smoothing per (tag, zone). 0.5 at 30 s windows ~ 1 min of memory: damps the
  # ~7 dB single-scan noise but still follows a real move within 1-2 windows.
  ewma_alpha: 0.5
  # Hysteresis: a challenger must beat the current zone by this much. Free-space
  # path loss is ~6 dB per doubling of distance, so a smaller win is within noise.
  rssi_margin_db: 6.0
  # Debounce: a new zone must win this many consecutive windows (applies to every
  # change, including leaving UNKNOWN). 2 = one stray window can never move a
  # worker; costs ~60 s of latency.
  debounce_windows: 2
  # Absence: unseen everywhere for this many consecutive windows -> UNKNOWN.
  # 4 windows = 2 min, bounding exposure wrongly attributed to someone who left.
  absence_windows: 4
  # Ignore sightings below this; it is near a BLE receiver's sensitivity floor,
  # where readings are unreliable.
  min_rssi_dbm: -95
  # A zone not heard in a window decays its EWMA toward this value, so stale
  # zones fade instead of freezing at their last reading.
  missing_rssi_dbm: -100
  # confidence = clip((assigned - runner_up) / this, 0, 1); 1.0 at twice the margin.
  confidence_full_margin_db: 12.0

# ingest/sessions.py - shift sessions from gate events.
sessions:
  # Longest plausible on-site session: an 8 h shift plus the longest configured
  # overtime (3 h) plus generous slack. Longer sessions are flagged, not dropped.
  max_session_h: 14

# ingest/subscriber.py
ingest:
  client_id_suffix: ingest       # client ID = mqtt.client_id_prefix + "-" + this
  clean_session: false           # broker queues QoS 1 messages while ingest is down
  batch_size: 500                # commit after this many messages ...
  batch_interval_s: 1.0          # ... or this long since the last commit, whichever first,
  # ... or once this many QoS 1 messages are waiting for their ack. Acks are sent
  # only after commit, and Mosquitto stops delivering when a client has
  # max_inflight_messages (default 20) unacked, so a larger batch would stall the
  # stream at ~20 msg/s. Raise both together if the broker's limit is raised.
  max_unacked: 20
  queue_poll_s: 0.2
  reconnect_min_s: 1             # paho reconnect backoff, doubling up to the max
  reconnect_max_s: 30
  stats_interval_s: 10           # default for --stats-interval
  payload_excerpt_chars: 200     # how much of a failing payload to log
  # wall: "now" is the wall clock (real hardware). stream: "now" is the newest
  # accepted telemetry/event ts (replays and accelerated simulation).
  time_reference: wall

paths:
  db_path: data/textile_ohs.db
  model_dir: models/
  log_dir: logs/
