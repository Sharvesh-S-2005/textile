# Local times in Asia/Kolkata. C shift crosses midnight.
shifts:
  timezone: Asia/Kolkata
  definitions:
    - shift_id: A
      start: "06:00"
      end: "14:00"
      breaks:
        - {kind: tea,   start: "08:00", duration_min: 10}
        - {kind: lunch, start: "10:00", duration_min: 30}
        - {kind: tea,   start: "12:00", duration_min: 10}
    - shift_id: B
      start: "14:00"
      end: "22:00"
      breaks:
        - {kind: tea,   start: "16:00", duration_min: 10}
        - {kind: lunch, start: "18:00", duration_min: 30}
        - {kind: tea,   start: "20:00", duration_min: 10}
    - shift_id: C
      start: "22:00"
      end: "06:00"
      breaks:
        - {kind: tea,   start: "00:00", duration_min: 10}
        - {kind: lunch, start: "02:00", duration_min: 30}
        - {kind: tea,   start: "04:00", duration_min: 10}

exposure_limits:
  criteria:
    niosh:
      criterion_db: 85
      exchange_rate_db: 3
      duration_h: 8
      threshold_db: 80             # levels below this contribute zero to the NIOSH dose
      source: "NIOSH 98-126, Criteria for a Recommended Standard: Occupational Noise Exposure"
    india:
      # Permitted exposure halves per 5 dB: 8 h at 90, 4 h at 95, 2 h at 100,
      # 1 h at 105, 30 min at 110, 15 min at 115 dBA.
      # NOTE: rules under the OSH Code 2020 may supersede this schedule; re-check
      # before final submission.
      criterion_db: 90
      exchange_rate_db: 5
      duration_h: 8
      threshold_db: 90             # levels below 90 dBA contribute zero to the India dose
      absolute_max_db: 115         # no exposure above this is permitted: hard alarm, not dose
      source: "Schedule XXVIII, Rule 95, Tamil Nadu Factories Rules"
  # ISO 7243:2017 WBGT reference value, metabolic rate class 2 (moderate work),
  # acclimatised worker. The assumption is stated wherever the value is shown.
  wbgt_limit_c: 28.0
  wbgt_work_category: moderate
  rh_correction_threshold_pct: 75

# Parameters of the exposure methods (exposure/). Assumptions, not measurements.
exposure_methods:
  pm_humidity_correction:
    # C_corr = C_raw / (1 + kappa * a_w / (1 - a_w)), a_w = RH/100 (Crilley et al. 2018).
    # Crilley et al. fitted kappa ~0.4 for ambient UK aerosol on an OPC-N2. Cotton dust
    # is fibrous cellulose, far less hygroscopic, so kappa is set low. A larger kappa
    # LOWERS the reported dust (the unsafe direction); 0.05 barely corrects and errs
    # toward over-reporting. An assumption of this project, not a measured value.
    kappa: 0.05
    # The form diverges as RH -> 100%. Above this RH, a_w is capped (project
    # assumption for numerical stability, not part of the cited method).
    rh_cap_pct: 95.0
    method: "kappa_koehler_crilley_2018"
    source: "Crilley et al. (2018), Atmospheric Measurement Techniques 11, 709-720"
  dust_label: indicative           # optical PM is never compared with regulatory limits
  wbgt:
    t_nw_method: stull_psychrometric_approximation
    source: "ISO 7243:2017 (WBGT); Stull (2011), J. Appl. Meteor. Climatol. 50, 2267-2269"
  personal:
    # Contract section 2: zone nodes publish env every 10 s; each reading is the
    # L_Aeq over the 10 s BEFORE its ts.
    env_reading_interval_s: 10
    # Flag a result whose zone presence is unknown for more than this share of
    # the session (its figures cover accounted time only: lower bounds).
    unaccounted_flag_pct: 10.0
    # Flag a result whose valid-reading coverage of the accounted time is below this.
    coverage_flag_pct: 90.0
    # Records carrying these validation flags are detected sensor anomalies (a
    # single-reading jump beyond the spike threshold, or a frozen sensor). They are
    # excluded from exposure integration - lost coverage, not data. Found on the
    # 7-day run: glitch readings of 120-138 dBA had entered doses (one 10 s
    # reading at 135 dBA adds ~3600% NIOSH dose). sensor_not_ok is not listed:
    # its fields are already null, and a needs_clean PM value reads high (safe side).
    exclude_record_flags: [spike, stuck_value]
    engine_version: "exposure-1.1"

# Valid ranges match docs/data_contract.md sections 4-6.
# spike_threshold = max plausible change between consecutive readings.
validation:
  fields:
    noise_dba:       {min: 30.0,  max: 140.0,   spike_threshold: 25.0}
    noise_peak_dba:  {min: 30.0,  max: 150.0,   spike_threshold: 35.0}
    pm25_ugm3:       {min: 0.0,   max: 2000.0,  spike_threshold: 500.0}
    pm10_ugm3:       {min: 0.0,   max: 3000.0,  spike_threshold: 800.0}
    temp_c:          {min: -10.0, max: 70.0,    spike_threshold: 5.0}
    rh_pct:          {min: 0.0,   max: 100.0,   spike_threshold: 15.0}
    globe_temp_c:    {min: -10.0, max: 90.0,    spike_threshold: 8.0}
    co2_ppm:         {min: 300,   max: 10000,   spike_threshold: 1500}
    current_a:       {min: 0.0,   max: 200.0,   spike_threshold: 150.0}
    vib_rms_g:       {min: 0.0,   max: 16.0,    spike_threshold: 5.0}
    vib_peak_g:      {min: 0.0,   max: 16.0,    spike_threshold: 10.0}
    scan_window_s:   {min: 5,     max: 120,     spike_threshold: 120}
    rssi_dbm:        {min: -100,  max: -20,     spike_threshold: 80}
    seen_count:      {min: 1,     max: 1000,    spike_threshold: 1000}
    # Status counters (section 9): non-negative integers; max = unsigned 32-bit.
    # Not history fields, so spike_threshold is never applied (set to the max).
    uptime_s:         {min: 0,    max: 4294967295, spike_threshold: 4294967295}
    buffered_records: {min: 0,    max: 4294967295, spike_threshold: 4294967295}
  allowed_sensor_flags: [ok, stale, error, uncalibrated, needs_clean]
  allowed_ppe_values: [worn, partial, not_worn, unknown]
  allowed_rfid_events: [check_in, check_out]
  stuck_value_count: 30
  future_ts_tolerance_s: 600
  late_upload_threshold_s: 7200

# ingest/localisation.py - BLE sightings -> one zone per worker per window.
# Values are chosen from physical reasoning, not fitted to the simulator.
localisation:
  method: ble_ewma_hysteresis     # stored with every assignment row
  window_s: 30                    # one decision per BLE scan window (contract: 30 s scans)
  # RSSI smoothing per (tag, zone). 0.5 at 30 s windows ~ 1 min of memory: damps the
  # ~7 dB single-scan noise but still follows a real move within 1-2 windows.
  ewma_alpha: 0.5
  # Hysteresis: a challenger must beat the current zone by this much. Free-space
  # path loss is ~6 dB per doubling of distance, so a smaller win is within noise.
  rssi_margin_db: 6.0
  # Debounce: a new zone must win this many consecutive windows (applies to every
  # change, including leaving UNKNOWN). 2 = one stray window can never move a
  # worker; costs ~60 s of latency.
  debounce_windows: 2
  # Absence: unseen everywhere for this many consecutive windows -> UNKNOWN.
  # 4 windows = 2 min, bounding exposure wrongly attributed to someone who left.
  absence_windows: 4
  # Ignore sightings below this; it is near a BLE receiver's sensitivity floor,
  # where readings are unreliable.
  min_rssi_dbm: -95
  # A zone not heard in a window decays its EWMA toward this value, so stale
  # zones fade instead of freezing at their last reading.
  missing_rssi_dbm: -100
  # confidence = clip((assigned - runner_up) / this, 0, 1); 1.0 at twice the margin.
  confidence_full_margin_db: 12.0

# ingest/sessions.py - shift sessions from gate events.
sessions:
  # Longest plausible on-site session: an 8 h shift plus the longest configured
  # overtime (3 h) plus generous slack. Longer sessions are flagged, not dropped.
  max_session_h: 14

# ingest/subscriber.py
ingest:
  client_id_suffix: ingest       # client ID = mqtt.client_id_prefix + "-" + this
  clean_session: false           # broker queues QoS 1 messages while ingest is down
  batch_size: 500                # commit after this many messages ...
  batch_interval_s: 1.0          # ... or this long since the last commit, whichever first,
  # ... or once this many QoS 1 messages are waiting for their ack. Acks are sent
  # only after commit, and Mosquitto stops delivering when a client has
  # max_inflight_messages (default 20) unacked, so a larger batch would stall the
  # stream at ~20 msg/s. Raise both together if the broker's limit is raised.
  max_unacked: 20
  queue_poll_s: 0.2
  reconnect_min_s: 1             # paho reconnect backoff, doubling up to the max
  reconnect_max_s: 30
  stats_interval_s: 10           # default for --stats-interval
  payload_excerpt_chars: 200     # how much of a failing payload to log
  # Day 8A memory bounds.
  wal_checkpoint_every_commits: 200   # PRAGMA wal_checkpoint(TRUNCATE) every N commits; WAL size logged
  max_queued_messages: 10000     # network-thread -> main-thread queue; a full queue blocks (back-pressure, never drops)
  max_history_devices: 64        # stuck/spike history is kept for at most this many device IDs
  # wall: "now" is the wall clock (real hardware). stream: "now" is the newest
  # accepted telemetry/event ts (replays and accelerated simulation).
  time_reference: wall

# exposure/risk_index.py - deterministic, transparent risk index (no training, no model).
# THE WEIGHTS AND RAMPS ARE A DESIGN CHOICE OF THIS PROJECT, NOT A VALIDATED CLINICAL MODEL.
risk_index:
  version: "risk-1.1"             # 1.1: hearing from L_EX,8h (1.0 used dose %, which saturated)
  weights: {hearing: 1.0, heat: 1.0, respiratory: 1.0}   # equal by default; normalised to sum 1
  bands: {low_max: 33.0, medium_max: 66.0}               # Low < 33 <= Medium < 66 <= High
  # confidence = data_coverage_pct * (1 - unaccounted_pct/100). Below this the band is
  # suppressed ("insufficient data"); the number is still shown.
  min_confidence_pct: 80.0
  hearing:
    # Input is L_EX,8h (ISO 9612), the standards' own unit: already logarithmic in
    # acoustic energy, so no ad-hoc transform. Linear map, clamped at both ends.
    # (risk-1.0 used dose % capped at 100%, which could not tell 235% from 3,378%.)
    l_ex_floor_db: 75.0           # -> 0
    l_ex_ceiling_db: 105.0        # -> 100
    daily_weight: 0.5             # today's L_EX,8h
    cumulative_weight: 0.5        # 7-day energy-mean daily L_EX,8h
  heat:
    # Piecewise linear ramps relative to the ISO 7243 reference value (28 C, moderate work):
    # WBGT max: 0 at (limit - 2 C), 100 at (limit + 6 C). Time above: 0 at 0 h, 100 at 4 h.
    wbgt_ramp_start_offset_c: -2.0
    wbgt_ramp_end_offset_c: 6.0
    hours_above_full_h: 4.0
    wbgt_weight: 0.5
    time_weight: 0.5
  respiratory:
    # COHORT-RELATIVE: percentile rank among the workers of the same day (no regulatory
    # anchor exists for optical PM). Ranks workers against each other, NOT a health threshold.
    metrics: [pm25_twa_raw, pm10_twa_raw, pm25_twa_hours_raw_7d]

# dashboard/ - Streamlit, reads SQLite through db/repo.py only (read-only connection).
dashboard:
  # Default: the committed offline demo copy (works with no simulator, broker or ingest).
  # A live run is shown with `-- --db data/textile_ohs.db`; OHS_DB also overrides.
  default_db: demo/textile_ohs_demo.db
  cache_ttl_s: 10                        # every read is cached this long (widget reruns stay fast)
  # One colour per risk band, same order everywhere; always shown with the band's name.
  band_colours: {Low: "#9E9E9E", Medium: "#CC79A7", High: "#6A3D9A", "insufficient data": "#FFFFFF"}
  default_worker: highest_index          # open the drilldown on the highest-index worker
  # Machine vibration alert: daily mean running vib_rms_g above this multiple of the
  # machine's own configured baseline. A design choice: ISO 10816 limits are in
  # velocity (mm/s), which these accelerometer RMS (g) readings are not.
  vibration_alert_ratio: 1.2
  results_numbers: docs/results_numbers.json   # headline numbers written by the results pack

# ml/ - hazard forecasting (Task A). Built only from stored tables via db/repo.py.
ml:
  bin_s: 60                        # 10 s telemetry resampled to 1-minute bins
  lags_min: [1, 2, 3, 5, 10, 15, 30]
  rolling_min: [5, 15, 30]         # rolling mean and std of each target series
  roc_min: 5                       # rate of change over the last 5 minutes
  env_rolling_min: 15              # rolling mean of temp / RH / CO2
  horizons_min: [30, 60]
  targets: [noise_dba, pm25_ugm3, wbgt_c]
  # Chronological split by whole days (fallback 60/20/20 if fewer days exist).
  split_days: {train: 5, validation: 1, test: 1}
  split_fallback_fractions: {train: 0.6, validation: 0.2, test: 0.2}
  random_seed: 42
  random_forest: {n_estimators: 200, max_depth: 14, min_samples_leaf: 5, n_jobs: -1}
  xgboost: {n_estimators: 400, max_depth: 6, learning_rate: 0.05, subsample: 0.8,
            colsample_bytree: 0.8, n_jobs: -1}
  # Exceedance lead time uses the India criterion level (exposure_limits.criteria.india).
  exceedance_criterion: india
  features_path: data/features.parquet
  predictions_path: data/forecast_predictions.parquet
  metrics_path: data/forecast_metrics.json
  # Exceedance classification (ml/classify_exceedance.py). Same split, features and
  # seed as forecasting. The label is the MEASURED noise at t+h vs the criterion.
  classification:
    criterion: india                 # exposure_limits.criteria.<name>.criterion_db (90 dBA)
    horizons_min: [30, 60]
    variants: [above, crossing]
    # Operating threshold = the one that maximises recall on the VALIDATION day subject
    # to false-positive rate (FP / (FP + TN)) <= this ceiling. Missing a hazardous
    # exposure is costlier than a false alarm, so recall is maximised, but the ceiling
    # stops the classifier from simply alarming all the time. A stated choice, not a
    # tuned value.
    max_false_positive_rate: 0.10
    # Reporting groups (Day 7): results are shown per group, never only averaged.
    # Z1 is not in the Day 7 brief's table; its `crossing` label is 82-85% positive
    # and the classifier predicts "yes" there almost always, so it sits with the loud zones.
    zone_groups:
      - {name: borderline, zones: [Z2, Z3, Z6], lead_zone: Z2,
         character: "hover near 90 dBA; crossings driven by small fluctuations, not the schedule — the case that matters"}
      - {name: always_loud, zones: [Z1, Z4, Z5],
         character: "above 90 dBA whenever machines run; `crossing` is ~82-100% positive (restarts after breaks), so prediction is trivial and the metric is uninformative"}
      - {name: excluded, zones: [Z7],
         character: "office; never reaches 90 dBA, so no positive class"}
    # Hyperparameter grids, searched on the validation day (selection metric: PR-AUC).
    grids:
      logistic_regression: {C: [0.01, 0.1, 1.0, 10.0], class_weight: [null, balanced]}
      random_forest: {n_estimators: [200], max_depth: [8, 14, null], min_samples_leaf: [5, 20]}
      xgboost: {n_estimators: [400], max_depth: [3, 6], learning_rate: [0.05, 0.1],
                subsample: [0.8], colsample_bytree: [0.8]}
    xgboost_early_stopping_rounds: 30
    predictions_path: data/classification_predictions.parquet
    metrics_path: data/classification_metrics.json
  # Model 1 / 2 / 3 feature ablation (ml/ablation.py). One model class for all three
  # sets, tuned SEPARATELY per set on the validation day over the same grid.
  ablation:
    model: xgboost
    grid: {n_estimators: [400], max_depth: [3, 6], learning_rate: [0.05, 0.1],
           subsample: [0.8], colsample_bytree: [0.8]}
    early_stopping_rounds: 30
    forecast_targets: [noise_dba, pm25_ugm3, wbgt_c]
    nl_targets: [noise_dba, pm25_ugm3]   # Day 7 no-lag redundancy analysis (heat skipped)
    classification_variants: [above, crossing]
    # Zone-history features added in Model 3 (trailing windows ending at t).
    history_long_window_min: 480     # 8 h: zone L_Aeq,8h-style noise and mean dust
    history_machine_window_min: 60   # fraction of the last hour machines were running
    history_min_coverage: 0.5        # NaN unless half the window has data
    # Block bootstrap on the test day: resample (zone, block) groups with replacement.
    # Blocks keep autocorrelated minutes together, so the interval is not falsely narrow.
    bootstrap_resamples: 500
    bootstrap_block_min: 60
    bootstrap_ci: 0.95
    metrics_path: data/ablation_metrics.json
  # Machine condition monitoring (ml/anomaly.py). Ground truth for evaluation only:
  # machines[].degrading. The detectors never see it.
  anomaly:
    db_path: data/week/textile_ohs.db  # the 7-day run the feature table was built from
    bin_min: 10                    # running-only vibration readings averaged per 10 min
    min_running_fraction: 0.5      # a bin is used only if the machine ran >= half of it
    reference_days: 1              # Phase I: each machine's first day is its own baseline
    rolling_bins: 6                # rolling means over 1 h of valid bins (IF features)
    # EWMA control chart on the standardised 10-min vib_rms. lambda 0.1 targets small
    # sustained shifts (wear); L = 3.5 keeps the in-control average run length far
    # above the ~1,000 bins a machine produces in a week. Set before looking at M5.
    ewma: {lambda: 0.1, limit_sigma: 3.5}
    # Isolation forest per machine, fitted on its reference bins; a bin is flagged if
    # its anomaly score exceeds the 99th percentile of the reference scores.
    isolation_forest: {n_estimators: 200, reference_quantile: 0.99}
    alarm_consecutive_bins: 3      # an ALARM = 3 consecutive flagged bins (both detectors)
    lead_lag_bin_min: 60
    lead_lag_max_lag_h: 12
    metrics_path: data/anomaly_metrics.json
  # Day 8 side-by-side comparison (ml/compare_datasets.py). Both datasets are evaluated
  # with identical code and configuration; only the simulator differs.
  comparison:
    deterministic_dir: data/                  # Day 4-7 outputs (data/week/textile_ohs.db)
    deterministic_db: data/week/textile_ohs.db
    stochastic_dir: data/week_stochastic/
    stochastic_db: data/week_stochastic/textile_ohs.db
    # Prediction 4b (pre-registered): share of sustained 90 dBA upward crossings in the
    # borderline zones within +/- window of a schedule boundary. Boundary = shift start +
    # crew changeover, shift end, break start, break end (the definition in
    # simulator/verify_stochastics.py). changeover_min mirrors
    # simulation.machine_dynamics.changeover_min (a mill practice; a test keeps them equal).
    clock_window_min: 10
    changeover_min: 10
    event_sustain_min: 5
  # Optional deep sequence model (ml/deep_forecast.py, Day 6 Task 4). Modest by design:
  # no architecture search. Compared against XGBoost on the ablation's Model 3 features.
  deep:
    targets: [noise_dba]
    seq_len_min: 60                # the last 60 minutes of the Model 3 feature set
    cell: gru
    hidden: 64
    layers: 1
    batch_size: 512
    learning_rate: 0.001
    max_epochs: 30
    patience: 4                    # early stopping on validation MAE
    time_cap_min: 45               # brief's hard cap; recorded if hit
    metrics_path: data/deep_forecast_metrics.json

# Every path is relative to the repository root, which is on the D: drive
# (D:/textile-ohs): databases, their WAL files and the ground-truth JSONL all live
# under data/ there, so the C: drive is never a constraint on a long run (Day 8A).
paths:
  db_path: data/textile_ohs.db
  model_dir: models/
  log_dir: logs/
  figures_dir: docs/figures/
